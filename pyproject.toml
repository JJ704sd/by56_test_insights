[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualityctl"
version = "0.1.0"
description = "Risk-driven regression selection and deterministic Agent evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Quality Engineering"}]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "jsonschema==4.26.0",
    "ruff==0.12.12",
]

[project.scripts]
qualityctl = "qualityctl.cli:main"
qualityctl-mcp = "qualityctl.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qualityctl = ["schemas/v1/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F822", "F841"]
