name: python-qualityctl

on:
  push:
    branches: [codex/record-desktop-inline-proof, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .[test]
      - name: Ruff
        run: python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: MCP smoke test
        run: python plugins/quality-gatekeeper/scripts/smoke_test.py
      - name: P1 evidence smoke test
        run: python plugins/quality-gatekeeper/scripts/p1_evidence_smoke.py
      - name: Embedded UI smoke test
        run: python plugins/quality-gatekeeper/embedded_ui/smoke_test.py
